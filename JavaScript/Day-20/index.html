<html>

<head>

	<title>Password Strength Checker</title>

</head>

<body>

<script>

	let password="Hello@123";
	let strength="";

	if(password.length<6)
	{
		strength="Weak";
	}
	else if(password.length<10)
	{
		strength="Medium";
	}
	else
	{
		strength="Strong";
	}

	document.write("Password = "+password);

	document.write("<br><br>");

	document.write("Password Strength = "+strength);

</script>

</body>

</html>
