<html>

<head>

	<title>Month and Number of Days</title>

</head>

<body>

<script>

	let month=2;

	if(month==1)
	{
		document.write("January - 31 Days");
	}
	else if(month==2)
	{
		document.write("February - 28 Days");
	}
	else if(month==3)
	{
		document.write("March - 31 Days");
	}
	else if(month==4)
	{
		document.write("April - 30 Days");
	}
	else if(month==5)
	{
		document.write("May - 31 Days");
	}
	else if(month==6)
	{
		document.write("June - 30 Days");
	}
	else if(month==7)
	{
		document.write("July - 31 Days");
	}
	else if(month==8)
	{
		document.write("August - 31 Days");
	}
	else if(month==9)
	{
		document.write("September - 30 Days");
	}
	else if(month==10)
	{
		document.write("October - 31 Days");
	}
	else if(month==11)
	{
		document.write("November - 30 Days");
	}
	else if(month==12)
	{
		document.write("December - 31 Days");
	}
	else
	{
		document.write("Invalid Month");
	}

</script>

</body>

</html>
